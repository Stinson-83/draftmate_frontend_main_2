<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Redline Review</title>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: #f1f5f9;
            box-sizing: border-box;
        }

        .scroll-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-sizing: border-box;
        }

        h3 {
            margin: 0 0 0.5rem 0;
            font-size: 14px;
            font-weight: 700;
            color: #818cf8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .section-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .selected-text-preview {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 0.5rem;
            font-size: 11.5px;
            color: #cbd5e1;
            font-style: italic;
            max-height: 80px;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            padding: 0.5rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
            font-size: 12px;
            outline: none;
        }

        button {
            background: #4f46e5;
            color: #ffffff;
            border: none;
            font-weight: 700;
            font-size: 12px;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: #6366f1;
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
        }

        .change-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .change-summary {
            font-weight: 700;
            color: #f8fafc;
            font-size: 12px;
        }

        .change-details {
            font-size: 11px;
            color: #94a3b8;
        }

        .change-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .accept-btn {
            background: #10b981;
            padding: 0.35rem 0.75rem;
            font-size: 11px;
        }

        .accept-btn:hover {
            background: #34d399;
        }

        .reject-btn {
            background: #ef4444;
            padding: 0.35rem 0.75rem;
            font-size: 11px;
        }

        .reject-btn:hover {
            background: #f87171;
        }

        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="scroll-wrapper">
        <h3>✨ AI Redlining</h3>

        <div class="section-box">
            <label style="font-weight: 600; font-size: 12px;">1. Highighted Clause Context</label>
            <div id="selection-status" class="selected-text-preview">
                Highlight text in the editor window and click "Capture" below.
            </div>
            <button id="btn-capture">Capture Highlights</button>
        </div>

        <div class="section-box">
            <label style="font-weight: 600; font-size: 12px;">2. AI Editor Instruction</label>
            <textarea id="ai-instruction" rows="3" placeholder="e.g. Change notice period to 90 days or make it favorable to the Customer..."></textarea>
            <button id="btn-generate" disabled>
                <span>Generate Redline Proposal</span>
            </button>
        </div>

        <div class="section-box">
            <label style="font-weight: 600; font-size: 12px;">3. Changes Review Panel</label>
            <div id="changes-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div style="font-style: italic; color: #64748b; font-size: 11px; text-align: center; margin: 1rem 0;">
                    No pending tracked changes.
                </div>
            </div>
        </div>
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
