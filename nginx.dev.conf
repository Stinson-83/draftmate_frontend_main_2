worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    client_max_body_size 100M;

    map $http_upgrade $connection_upgrade {
        default   keep-alive;
        websocket upgrade;
        ''        close;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;

        # ── ONLYOFFICE Document Server (separate container) ─────────────────
        location /onlyoffice/ {
            proxy_pass http://onlyoffice-server:80/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /onlyoffice;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /cache/files/ {
            proxy_pass http://onlyoffice-server:80/cache/files/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /doc/ {
            proxy_pass http://onlyoffice-server:80/doc/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /heartbeat {
            proxy_pass http://onlyoffice-server:80/heartbeat;
            proxy_set_header Host $http_host;
        }

        location /info {
            proxy_pass http://onlyoffice-server:80/info;
            proxy_set_header Host $http_host;
        }

        # ── Backend microservices running on Host ───────────────────────────
        location /converter/   { proxy_pass http://host.docker.internal:8000/; }
        location /query/       { proxy_pass http://host.docker.internal:8001/; }
        location /enhance/     { proxy_pass http://host.docker.internal:8002/; }
        location /drafter/     { proxy_pass http://host.docker.internal:8003/; }
        location /lexbot/      { proxy_pass http://host.docker.internal:8004/; }
        location /pdf/         { proxy_pass http://host.docker.internal:8005/; }
        location /case_search/ { proxy_pass http://host.docker.internal:8006/; }
        location /advocate-api/ { proxy_pass http://host.docker.internal:8007/; }
        location /auth/        { proxy_pass http://host.docker.internal:8009/; }
        location /workflow/    { proxy_pass http://host.docker.internal:8010/; }
        location /library-api/ { proxy_pass http://host.docker.internal:8008/; }
        location /translator/  { proxy_pass http://host.docker.internal:8012/; }
        location /notification/ { proxy_pass http://host.docker.internal:8015/; }
        location /subscriptions/ { proxy_pass http://host.docker.internal:8016/; }

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        # ── Proxy to Vite dev server running on Host ────────────────────────
        location / {
            proxy_pass http://host.docker.internal:5173/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
