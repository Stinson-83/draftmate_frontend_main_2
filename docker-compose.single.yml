version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_CLIENT_ID=${VITE_CLIENT_ID}
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Draftmate9989}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Draftmate9989}@db:5432/${POSTGRES_DB:-postgres}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - IKApi=${IKApi}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - EMBED_MODEL=${EMBED_MODEL:-/app/backend/models/embedding}
      - RERANK_MODEL=${RERANK_MODEL:-/app/backend/models/rerank}
      - EASYOCR_MODULE_PATH=${EASYOCR_MODULE_PATH:-/app/backend/models/easyocr}
      - MEM0_ENABLED=${MEM0_ENABLED}
      - SESSION_CACHE_TTL=${SESSION_CACHE_TTL}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - JWT_SECRET=${JWT_SECRET:-draftmate_jwt_production_signing_key_2026}
      - SECRET_KEY=${SECRET_KEY:-draftmate_jwt_production_signing_key_2026}
      - QDRANT_HOST=qdrant
      - AUTH_SERVICE_URL=http://127.0.0.1:8009
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FRONTEND_URL_DEV=${FRONTEND_URL_DEV}
      - FRONTEND_URL_PROD=${FRONTEND_URL_PROD}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - DRAFTER_SELF_URL=http://app:8080/drafter
    depends_on:
      - db
      - qdrant
      - onlyoffice-server

  onlyoffice-server:
    image: onlyoffice/documentserver:latest
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:-draftmate_jwt_production_signing_key_2026}
      - DEV_BYPASS_AUTH=true
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - ./shared_drafts:/var/www/onlyoffice/Data/shared
      - ./public/plugins/assistant:/var/www/onlyoffice/documentserver/sdkjs-plugins/assistant
    ports:
      - "8081:80"
    extra_hosts:
      - "app:host-gateway"
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  db:
    image: ankane/pgvector:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Draftmate9989}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
