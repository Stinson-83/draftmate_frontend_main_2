services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_API_URL=http://backend
      - ONLYOFFICE_API_URL=http://onlyoffice-server
      - VITE_CLIENT_ID=${VITE_CLIENT_ID}
      - VITE_PUBLIC_APP_URL=https://www.draftmate.in
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: rebuild
          path: package.json

  onlyoffice-server:
    image: onlyoffice/documentserver:latest
    env_file:
      - .env
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${JWT_SECRET}
      - DEV_BYPASS_AUTH=true
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - ./shared_drafts:/var/www/onlyoffice/Data/shared
      - ./public/plugins/assistant:/var/www/onlyoffice/documentserver/sdkjs-plugins/assistant
      - onlyoffice_cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files/data
    ports:
      - "8081:80"
    extra_hosts:
      - "drafter-service:host-gateway"
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Draftmate9989
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_CLIENT_ID=${VITE_CLIENT_ID}
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # host:container — nginx inside the image listens on 80.
      # Map host 8080 -> container 8080.
      - "8080:8080"
      - "8003:8003"
    environment:
      - DRAFTER_SELF_URL=http://backend:8003
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - GOOGLE_SERP_API_KEY=${GOOGLE_SERP_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - FIRECRAWLER_API_KEY=${FIRECRAWLER_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - IKApi=${IKApi}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - PSQL_PASSWD=${PSQL_PASSWD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LLM_MODE=${LLM_MODE}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - EMBED_MODEL=${EMBED_MODEL}
      - RERANK_MODEL=${RERANK_MODEL}
      - MEM0_ENABLED=${MEM0_ENABLED}
      - SESSION_CACHE_TTL=${SESSION_CACHE_TTL}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - SCRAPE_DELAY=${SCRAPE_DELAY}
      - MAX_TOKENS_PER_QUERY=${MAX_TOKENS_PER_QUERY}
      - MAX_TOKENS_PER_USER_DAILY=${MAX_TOKENS_PER_USER_DAILY}
      - AGENT_TIMEOUT=${AGENT_TIMEOUT}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT}
      - MAX_QUERY_LENGTH=${MAX_QUERY_LENGTH}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM}
      - CHAT_RETENTION_DAYS=${CHAT_RETENTION_DAYS}
      - MEM0_RETENTION_DAYS=${MEM0_RETENTION_DAYS}
      - TEST_MODE=${TEST_MODE}
      - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS}
      - PREFERRED_DOMAINS=${PREFERRED_DOMAINS}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER}
      - INPUT_JSON=${INPUT_JSON}
      - INTERACTIVE=${INTERACTIVE}
      - SSH_KEY_PATH=/app/bastion.key.pem
      - BASTION_IP=${BASTION_IP}
      - SSH_USER=${SSH_USER}
      - POSTGRES_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - AUTH_SERVICE_URL=http://127.0.0.1:8009
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FRONTEND_URL_DEV=${FRONTEND_URL_DEV}
      - FRONTEND_URL_PROD=${FRONTEND_URL_PROD}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - QDRANT_HOST=qdrant
      - JWT_SECRET=${JWT_SECRET}
      - ADVOCATE_PROFILE_PORT=8007
      - NOTIFICATION_SERVICE_URL=http://127.0.0.1:8015
      - SHARED_STORAGE_PATH=/app/shared_drafts
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    depends_on:
      db:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - /app/backend/models
      - ./src/data/bareacts:/app/src/data/bareacts
      - ./shared_drafts:/app/shared_drafts
      - onlyoffice_cache:/onlyoffice_cache
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
          ignore:
            - backend/__pycache__/
            - backend/Deep_research/lex_bot/data/
        - action: rebuild
          path: requirements.txt

volumes:
  postgres_data:
  qdrant_data:
  translator_original_data:
  translator_translated_data:
  onlyoffice_cache:
